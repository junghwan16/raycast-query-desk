<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omok</title>
    <style>
      /* CSS */
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="heading">
        <h1 id="connection"></h1>
        <p id="summary"></p>
      </div>
      <label class="find">
        <span aria-hidden="true">⌕</span>
        <input
          id="find"
          type="search"
          aria-label="Filter rows"
          placeholder="Filter rows…"
          autocomplete="off"
        />
        <kbd>⌘F</kbd>
      </label>
      <div class="export">
        <button id="copy-slack" class="primary" disabled>Copy for Slack</button>
        <button id="copy-markdown" disabled>Markdown</button>
      </div>
    </header>
    <main>
      <div
        id="scroll-area"
        class="scroll-area"
        tabindex="0"
        aria-label="Query results"
      >
        <table>
          <colgroup id="columns"></colgroup>
          <thead>
            <tr id="headers"></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" hidden></p>
      </div>
      <aside id="inspector" hidden aria-label="Cell value">
        <header>
          <div>
            <h2 id="field"></h2>
            <p id="position"></p>
          </div>
          <button id="close-inspector" aria-label="Close cell inspector">
            ×
          </button>
        </header>
        <pre id="value"></pre>
        <button id="copy-value">Copy Value</button>
      </aside>
    </main>
    <footer>
      <span id="status" aria-live="polite"></span><span id="selection"></span>
    </footer>
    <script id="result-data" type="application/octet-stream">
      <!-- OMOK_STATE -->
    </script>
    <script>
      /* SCRIPT */
    </script>
  </body>
</html>
